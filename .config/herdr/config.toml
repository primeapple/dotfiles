onboarding = false

[theme]
name = "kanagawa"

[terminal]
new_cwd = "follow"

[ui.toast]
delivery = "system"

[ui]
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false

[keys]
close_tab = ["prefix+shift+x", "ctrl+shift+w"]
copy_mode = ["prefix+[", "ctrl+shift+["]
detach = ["prefix+q", "ctrl+shift+q"]
edit_scrollback = ["prefix+e", "ctrl+shift+e"]
goto = ""
# Sadly the prefixes don't work yet due to stupid navigation mode
navigate_workspace_down = ["ctrl+shift+j", "ctrl+shift+down"]
navigate_workspace_up = ["ctrl+shift+k", "ctrl+shift+up"]
new_tab = ["prefix+t", "ctrl+shift+t"]
new_workspace = ["prefix+enter", "ctrl+shift+enter"]
next_tab = ["prefix+n", "ctrl+shift+n"]
previous_tab = ["prefix+p", "ctrl+shift+p"]
split_horizontal = ["prefix+-", "ctrl+shift+-"]
split_vertical = ["prefix+/", "ctrl+shift+/"]
switch_tab = ["prefix+1..9", "ctrl+shift+1..9"]
